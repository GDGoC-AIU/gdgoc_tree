<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>redirect</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="container-background">
        <div class="container">
            <div class="google-circle blue"> </div>
            <div class="google-circle red"> </div>
            <div class="google-circle green"> </div>
            <div class="google-circle yellow"> </div>

            <div class="text align-left">
                <image class="logo" src="/assets/icons/gdgoc-logo.png" alt="gdgoc-logo" />

                </image>
                <h1>Stay Connected!</h1>
                <p>Click the button below to be redirected to our Social Media profiles.</p>
            </div>

            <div class="row align-center">
                <div class="column button-container">
                    <a id="instagram" class="red" href="">
                        <img src="/assets/icons/instagram-icon.png" alt="instagram" />
                        <span>Instagram</span>
                    </a>

                    <a id="discord" class="blue" href="">
                        <img src="/assets/icons/discord-icon.jpg" alt="discord" />
                        <span>Discord</span>
                    </a>

                    <a id="website" class="yellow" href="">
                        <img src="/assets/icons/vite.svg" alt="website" />
                        <span>Website</span>
                    </a>
                </div>
            </div>
        </div>
    </div>


    <script type="module" src="/src/redirect.js"></script>
</body>

</html>
